apiVersion: apps/v1
kind: Deployment
metadata:
  name: voterx-api
  labels:
    app: voterx-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voterx-api
  template:
    metadata:
      labels:
        app: voterx-api
    spec:
      containers:
        - name: api
          image: chitnisa/voterx:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: REDIS_URL
              value: redis://redis:6379
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: voterx-api
  labels:
    app: voterx-api
spec:
  type: ClusterIP
  selector:
    app: voterx-api
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voterx-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik-internal
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voterx-api
                port:
                  name: http
